<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TREINA PADEL — Subir comprobante de pago</title>
  <style>
    :root {
      --court: #1B4F3C;
      --court-light: #2F6B4F;
      --court-soft: #E7EFE9;
      --clay: #C2703F;
      --sand: #F6F2E9;
      --paper: #FFFFFF;
      --ink: #22271F;
      --slate: #6E7A6F;
      --line: #DAD9C9;
      --warn: #C24B3A;
      --warn-soft: #F7E2DD;
      --ok: #2F7A4F;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--sand);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }
    .header {
      background: var(--court);
      color: #fff;
      border-bottom: 4px solid var(--clay);
      padding: 22px 18px;
      text-align: center;
    }
    .header h1 { font-size: 22px; letter-spacing: 0.3px; }
    .header p {
      font-size: 12px; color: #C9D8CE;
      text-transform: uppercase; letter-spacing: 0.6px; margin-top: 3px;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 16px;
      margin-bottom: 14px;
    }
    .intro { font-size: 13.5px; color: var(--slate); line-height: 1.5; margin-bottom: 16px; }
    .intro strong { color: var(--ink); }
    label.field-label {
      display: block;
      font-size: 11.5px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.6px;
      color: var(--slate);
      margin-bottom: 6px;
    }
    .upload-box {
      border: 2px dashed var(--line);
      border-radius: 12px;
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 14px;
      transition: border-color 0.15s;
    }
    .upload-box.has-file { border-color: var(--court); border-style: solid; padding: 12px; }
    .upload-box .icon { font-size: 30px; margin-bottom: 6px; }
    .upload-box .label { font-size: 13.5px; font-weight: 700; color: var(--court); }
    .upload-box .sub { font-size: 12px; color: var(--slate); margin-top: 4px; }
    #preview {
      display: none;
      max-width: 100%;
      max-height: 320px;
      border-radius: 8px;
      margin: 0 auto;
    }
    #fileInput { display: none; }
    .error {
      display: none;
      background: var(--warn-soft);
      color: var(--warn);
      font-size: 13px; font-weight: 700;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .error.show { display: block; }
    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      font-size: 15px;
      font-family: inherit;
      padding: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .btn-primary { background: var(--court); color: #fff; }
    .btn-primary:active { background: var(--court-light); }
    .btn-ghost {
      background: transparent;
      color: var(--court);
      border: 1.5px dashed var(--line);
      margin-top: 10px;
      font-size: 13.5px;
      padding: 11px;
    }
    .done {
      display: none;
      text-align: center;
      padding: 10px 0 4px;
    }
    .done.show { display: block; }
    .done .big { font-size: 38px; }
    .done p { font-size: 14px; color: var(--slate); margin-top: 8px; line-height: 1.5; }
    .footer { text-align: center; font-size: 11.5px; color: var(--slate); margin-top: 18px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎾 TREINA PADEL</h1>
    <p>Comprobante de pago</p>
  </div>

  <div class="wrap">
    <div class="card" id="tarjetaValida">
      <div id="contenido">
        <p class="intro" id="intro">Cargando…</p>

        <label class="field-label">Foto del comprobante</label>
        <div class="upload-box" id="uploadBox">
          <img id="preview" alt="Vista previa del comprobante" />
          <div id="uploadPrompt">
            <div class="icon">📎</div>
            <div class="label">Tocá para elegir o sacar una foto</div>
            <div class="sub">JPG o PNG, hasta 10 MB</div>
          </div>
        </div>
        <input type="file" id="fileInput" accept="image/*" />

        <div class="error" id="error"></div>

        <button class="btn btn-primary" id="enviar">Enviar comprobante</button>
      </div>

      <div class="done" id="done">
        <div class="big">✅</div>
        <p id="done-text">¡Listo! Tu comprobante fue enviado.</p>
      </div>
    </div>

    <div class="card" id="tarjetaInvalida" style="display: none;">
      <p class="intro" style="margin-bottom: 0;">
        Este link no es válido. Pedile al profe que te mande tu link personal de comprobantes.
      </p>
    </div>

    <p class="footer">TREINA PADEL · Administración de Pagos</p>
  </div>

  <script src="config.js"></script>
  <script>
    // Teléfono y credenciales de Supabase salen de config.js (un solo
    // lugar para rotarlos en vez de repetirlos en cada formulario).
    var TELEFONO_PROFE = window.APP_CONFIG.TELEFONO_PROFE;
    var SUPA_URL = window.APP_CONFIG.SUPA_URL;
    var SUPA_KEY = window.APP_CONFIG.SUPA_KEY;

    var params = new URLSearchParams(window.location.search);
    var studentId = params.get("id");
    var studentName = params.get("n") || "";
    var mesParam = params.get("m") || ""; // "YYYY-MM" del mes que se está cobrando (viene del mensaje que mandó el profe)

    if (!studentId) {
      document.getElementById("tarjetaValida").style.display = "none";
      document.getElementById("tarjetaInvalida").style.display = "block";
      throw new Error("link sin id");
    }

    function monthKeyNow() {
      var d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }
    // Si el link trae "m" (el mensaje se mandó con el mes ya resuelto, por
    // ejemplo se mandó el cobro de septiembre a fin de agosto), se usa ese
    // mes en vez del mes calendario del día en que se abre el link — si no,
    // el comprobante quedaría cargado en el mes equivocado. Los links viejos
    // sin "m" siguen cayendo en el mes calendario actual.
    function monthKeyToUse() {
      return /^\d{4}-\d{2}$/.test(mesParam) ? mesParam : monthKeyNow();
    }
    function monthLabelFor(monthKey) {
      var partes = monthKey.split("-");
      var d = new Date(Number(partes[0]), Number(partes[1]) - 1, 1);
      var s = d.toLocaleDateString("es-AR", { month: "long", year: "numeric" });
      return s.charAt(0).toUpperCase() + s.slice(1);
    }
    function monthLabelNow() {
      return monthLabelFor(monthKeyToUse());
    }

    // Se arma con nodos de texto (no innerHTML) porque studentName viene
    // crudo de la URL (?n=...): si se lo mete en innerHTML como string,
    // alguien podría mandar un link con HTML/script en el nombre y
    // ejecutarlo en el navegador de quien lo abre (XSS reflejado).
    var intro = document.getElementById("intro");
    intro.textContent = "¡Hola";
    if (studentName) {
      intro.appendChild(document.createTextNode(" "));
      var nombreEl = document.createElement("strong");
      nombreEl.textContent = studentName;
      intro.appendChild(nombreEl);
    }
    intro.appendChild(document.createTextNode("! Subí acá la foto del comprobante de tu transferencia de "));
    var mesEl = document.createElement("strong");
    mesEl.textContent = monthLabelNow();
    intro.appendChild(mesEl);
    intro.appendChild(document.createTextNode("."));

    var archivoElegido = null;
    var fileInput = document.getElementById("fileInput");
    var uploadBox = document.getElementById("uploadBox");
    var preview = document.getElementById("preview");
    var uploadPrompt = document.getElementById("uploadPrompt");

    uploadBox.onclick = function () { fileInput.click(); };

    fileInput.onchange = function () {
      limpiarError();
      var f = fileInput.files[0];
      if (!f) return;
      if (f.type.indexOf("image/") !== 0) { mostrarError("Elegí una imagen (foto o captura de pantalla)."); return; }
      if (f.size > 10 * 1024 * 1024) { mostrarError("La imagen pesa demasiado (máximo 10 MB)."); return; }
      archivoElegido = f;
      preview.src = URL.createObjectURL(f);
      preview.style.display = "block";
      uploadPrompt.style.display = "none";
      uploadBox.className = "upload-box has-file";
    };

    function mostrarError(msg) {
      var e = document.getElementById("error");
      e.textContent = msg;
      e.className = "error show";
    }
    function limpiarError() {
      document.getElementById("error").className = "error";
    }
    function mostrarListo(texto) {
      document.getElementById("contenido").style.display = "none";
      document.getElementById("done-text").textContent = texto;
      document.getElementById("done").className = "done show";
    }

    function extensionDe(tipo) {
      if (tipo === "image/png") return "png";
      if (tipo === "image/webp") return "webp";
      if (tipo === "image/heic" || tipo === "image/heif") return "heic";
      return "jpg";
    }

    function mostrarErrorEnvio() {
      var msgWa = "Hola! Quiero mandarte mi comprobante de pago de " + monthLabelNow()
        + " pero no lo pude subir desde la web. Te lo mando por acá.";
      var contenedor = document.getElementById("error");
      contenedor.innerHTML = "No se pudo enviar el comprobante. Revisá tu conexión y probá de nuevo, "
        + "o mandaselo directo al profe por WhatsApp."
        + (TELEFONO_PROFE && TELEFONO_PROFE !== "5491100000000"
          ? ' <a href="https://wa.me/' + TELEFONO_PROFE + '?text=' + encodeURIComponent(msgWa) + '" target="_blank" style="color: inherit; text-decoration: underline;">Abrir WhatsApp</a>'
          : "");
      contenedor.className = "error show";
    }

    document.getElementById("enviar").onclick = function () {
      limpiarError();
      if (!archivoElegido) { mostrarError("Elegí primero la foto del comprobante."); return; }

      var boton = document.getElementById("enviar");
      boton.disabled = true;
      boton.textContent = "Enviando…";

      var path = studentId + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + extensionDe(archivoElegido.type);

      fetch(SUPA_URL + "/storage/v1/object/comprobantes/" + path, {
        method: "POST",
        headers: {
          "apikey": SUPA_KEY,
          "Authorization": "Bearer " + SUPA_KEY,
          "Content-Type": archivoElegido.type,
        },
        body: archivoElegido,
      }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status + " al subir la imagen");
        return fetch(SUPA_URL + "/rest/v1/comprobantes", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPA_KEY,
            "Authorization": "Bearer " + SUPA_KEY,
            "Prefer": "return=minimal",
          },
          body: JSON.stringify({
            student_id: studentId,
            student_name: studentName,
            mes: monthKeyToUse(),
            imagen_path: path,
          }),
        });
      }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status + " al registrar el comprobante");
        mostrarListo("¡Listo! Tu comprobante de " + monthLabelNow() + " fue enviado. Gracias!");
      }).catch(function () {
        mostrarErrorEnvio();
      }).finally(function () {
        boton.disabled = false;
        boton.textContent = "Enviar comprobante";
      });
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TREINA PADEL — Confirmar lugar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stripes"></div>
  <div class="header">
    <div class="brand">TREINA</div>
    <div class="brand-sub">PADEL</div>
    <p>Confirmar lugar</p>
  </div>

  <div class="wrap">
    <div class="card" id="tarjetaValida">
      <div id="contenido">
        <p class="intro" id="intro">Cargando…</p>

        <div class="error" id="error"></div>

        <button class="btn btn-primary" id="confirmar">Confirmar mi lugar</button>
      </div>

      <div class="done" id="done">
        <div class="big">✅</div>
        <p id="done-text">¡Listo! Confirmaste tu lugar.</p>
      </div>
    </div>

    <div class="card" id="tarjetaInvalida" style="display: none;">
      <p class="intro" style="margin-bottom: 0;">
        Este link no es válido. Pedile al profe que te mande tu link personal de confirmación.
      </p>
    </div>

    <p class="footer">TREINA PADEL · Administración de clases</p>
  </div>

  <script src="config.js"></script>
  <script>
    // Teléfono y credenciales de Supabase salen de config.js (un solo
    // lugar para rotarlos en vez de repetirlos en cada formulario).
    var TELEFONO_PROFE = window.APP_CONFIG.TELEFONO_PROFE;
    var SUPA_URL = window.APP_CONFIG.SUPA_URL;
    var SUPA_KEY = window.APP_CONFIG.SUPA_KEY;

    var params = new URLSearchParams(window.location.search);
    var studentId = params.get("id");
    var studentName = params.get("n") || "";
    var mesParam = params.get("m") || ""; // "YYYY-MM" del mes que se está cobrando (viene del mensaje que mandó el profe)

    if (!studentId) {
      document.getElementById("tarjetaValida").style.display = "none";
      document.getElementById("tarjetaInvalida").style.display = "block";
      throw new Error("link sin id");
    }

    function monthKeyNow() {
      var d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }
    // Si el link trae "m" (mensaje mandado con el mes correspondiente ya
    // resuelto, por ejemplo se mandó el cobro de septiembre a fin de agosto),
    // se usa ese mes en vez del mes calendario del día en que se abre el
    // link — si no, la confirmación quedaría cargada en el mes equivocado.
    // Los links viejos sin "m" siguen cayendo en el mes calendario actual.
    function monthKeyToUse() {
      return /^\d{4}-\d{2}$/.test(mesParam) ? mesParam : monthKeyNow();
    }
    function monthLabelFor(monthKey) {
      var partes = monthKey.split("-");
      var d = new Date(Number(partes[0]), Number(partes[1]) - 1, 1);
      var s = d.toLocaleDateString("es-AR", { month: "long", year: "numeric" });
      return s.charAt(0).toUpperCase() + s.slice(1);
    }
    function monthLabelNow() {
      return monthLabelFor(monthKeyToUse());
    }

    // Se arma con nodos de texto (no innerHTML) porque studentName viene
    // crudo de la URL (?n=...): si se lo mete en innerHTML como string,
    // alguien podría mandar un link con HTML/script en el nombre y
    // ejecutarlo en el navegador de quien lo abre (XSS reflejado).
    var intro = document.getElementById("intro");
    intro.textContent = "¡Hola";
    if (studentName) {
      intro.appendChild(document.createTextNode(" "));
      var nombreEl = document.createElement("strong");
      nombreEl.textContent = studentName;
      intro.appendChild(nombreEl);
    }
    intro.appendChild(document.createTextNode("! Tocá el botón para confirmar tu lugar de "));
    var mesEl = document.createElement("strong");
    mesEl.textContent = monthLabelNow();
    intro.appendChild(mesEl);
    intro.appendChild(document.createTextNode("."));

    function mostrarError(msg) {
      var e = document.getElementById("error");
      e.textContent = msg;
      e.className = "error show";
    }
    function limpiarError() {
      document.getElementById("error").className = "error";
    }
    function mostrarListo() {
      document.getElementById("contenido").style.display = "none";
      document.getElementById("done").className = "done show";
    }

    function mostrarErrorEnvio() {
      var msgWa = "Hola! Quiero confirmar mi lugar de " + monthLabelNow()
        + " pero no lo pude hacer desde la web. Te confirmo por acá.";
      var contenedor = document.getElementById("error");
      contenedor.innerHTML = "No se pudo enviar la confirmación. Revisá tu conexión y probá de nuevo, "
        + "o confirmale directo al profe por WhatsApp."
        + (TELEFONO_PROFE && TELEFONO_PROFE !== "5491100000000"
          ? ' <a href="https://wa.me/' + TELEFONO_PROFE + '?text=' + encodeURIComponent(msgWa) + '" target="_blank" style="color: inherit; text-decoration: underline;">Abrir WhatsApp</a>'
          : "");
      contenedor.className = "error show";
    }

    document.getElementById("confirmar").onclick = function () {
      limpiarError();
      var boton = document.getElementById("confirmar");
      boton.disabled = true;
      boton.textContent = "Confirmando…";

      fetch(SUPA_URL + "/rest/v1/confirmaciones", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPA_KEY,
          "Authorization": "Bearer " + SUPA_KEY,
          "Prefer": "return=minimal",
        },
        body: JSON.stringify({
          student_id: studentId,
          student_name: studentName,
          mes: monthKeyToUse(),
        }),
      }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status + " al registrar la confirmación");
        mostrarListo();
      }).catch(function () {
        mostrarErrorEnvio();
      }).finally(function () {
        boton.disabled = false;
        boton.textContent = "Confirmar mi lugar";
      });
    };
  </script>
</body>
</html>

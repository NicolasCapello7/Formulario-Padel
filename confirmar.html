<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TREINA PADEL — Confirmar lugar</title>
  <style>
    :root {
      --court: #1B4F3C;
      --court-light: #2F6B4F;
      --court-soft: #E7EFE9;
      --clay: #C2703F;
      --sand: #F6F2E9;
      --paper: #FFFFFF;
      --ink: #22271F;
      --slate: #6E7A6F;
      --line: #DAD9C9;
      --warn: #C24B3A;
      --warn-soft: #F7E2DD;
      --ok: #2F7A4F;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--sand);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }
    .header {
      background: var(--court);
      color: #fff;
      border-bottom: 4px solid var(--clay);
      padding: 22px 18px;
      text-align: center;
    }
    .header h1 { font-size: 22px; letter-spacing: 0.3px; }
    .header p {
      font-size: 12px; color: #C9D8CE;
      text-transform: uppercase; letter-spacing: 0.6px; margin-top: 3px;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 16px;
      margin-bottom: 14px;
    }
    .intro { font-size: 13.5px; color: var(--slate); line-height: 1.5; margin-bottom: 16px; }
    .intro strong { color: var(--ink); }
    .error {
      display: none;
      background: var(--warn-soft);
      color: var(--warn);
      font-size: 13px; font-weight: 700;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .error.show { display: block; }
    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      font-size: 15px;
      font-family: inherit;
      padding: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .btn-primary { background: var(--court); color: #fff; }
    .btn-primary:active { background: var(--court-light); }
    .done {
      display: none;
      text-align: center;
      padding: 10px 0 4px;
    }
    .done.show { display: block; }
    .done .big { font-size: 38px; }
    .done p { font-size: 14px; color: var(--slate); margin-top: 8px; line-height: 1.5; }
    .footer { text-align: center; font-size: 11.5px; color: var(--slate); margin-top: 18px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎾 TREINA PADEL</h1>
    <p>Confirmar lugar</p>
  </div>

  <div class="wrap">
    <div class="card" id="tarjetaValida">
      <div id="contenido">
        <p class="intro" id="intro">Cargando…</p>

        <div class="error" id="error"></div>

        <button class="btn btn-primary" id="confirmar">Confirmar mi lugar</button>
      </div>

      <div class="done" id="done">
        <div class="big">✅</div>
        <p id="done-text">¡Listo! Confirmaste tu lugar.</p>
      </div>
    </div>

    <div class="card" id="tarjetaInvalida" style="display: none;">
      <p class="intro" style="margin-bottom: 0;">
        Este link no es válido. Pedile al profe que te mande tu link personal de confirmación.
      </p>
    </div>

    <p class="footer">TREINA PADEL · Administración de clases</p>
  </div>

  <script>
    // ⚠️ CAMBIAR ACÁ: número de WhatsApp del profe, con código de país y solo dígitos.
    var TELEFONO_PROFE = "5491100000000";

    // Base de datos en la nube (Supabase). La anon key es pública por diseño:
    // solo permite ENVIAR una confirmación, no leer ni tocar ningún dato ajeno.
    var SUPA_URL = "https://yhmtbvkpjadsvcdziegx.supabase.co";
    var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlobXRidmtwamFkc3ZjZHppZWd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNjgwNTAsImV4cCI6MjA5OTg0NDA1MH0.koAPJeVAkugiPz9yT_eg3wWqUe9NtbkU-2Yw_wt-3m4";

    var params = new URLSearchParams(window.location.search);
    var studentId = params.get("id");
    var studentName = params.get("n") || "";
    var mesParam = params.get("m") || ""; // "YYYY-MM" del mes que se está cobrando (viene del mensaje que mandó el profe)

    if (!studentId) {
      document.getElementById("tarjetaValida").style.display = "none";
      document.getElementById("tarjetaInvalida").style.display = "block";
      throw new Error("link sin id");
    }

    function monthKeyNow() {
      var d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }
    // Si el link trae "m" (mensaje mandado con el mes correspondiente ya
    // resuelto, por ejemplo se mandó el cobro de septiembre a fin de agosto),
    // se usa ese mes en vez del mes calendario del día en que se abre el
    // link — si no, la confirmación quedaría cargada en el mes equivocado.
    // Los links viejos sin "m" siguen cayendo en el mes calendario actual.
    function monthKeyToUse() {
      return /^\d{4}-\d{2}$/.test(mesParam) ? mesParam : monthKeyNow();
    }
    function monthLabelFor(monthKey) {
      var partes = monthKey.split("-");
      var d = new Date(Number(partes[0]), Number(partes[1]) - 1, 1);
      var s = d.toLocaleDateString("es-AR", { month: "long", year: "numeric" });
      return s.charAt(0).toUpperCase() + s.slice(1);
    }
    function monthLabelNow() {
      return monthLabelFor(monthKeyToUse());
    }

    document.getElementById("intro").innerHTML =
      "¡Hola" + (studentName ? " <strong>" + studentName + "</strong>" : "") + "! "
      + "Tocá el botón para confirmar tu lugar de <strong>" + monthLabelNow() + "</strong>.";

    function mostrarError(msg) {
      var e = document.getElementById("error");
      e.textContent = msg;
      e.className = "error show";
    }
    function limpiarError() {
      document.getElementById("error").className = "error";
    }
    function mostrarListo() {
      document.getElementById("contenido").style.display = "none";
      document.getElementById("done").className = "done show";
    }

    function mostrarErrorEnvio() {
      var msgWa = "Hola! Quiero confirmar mi lugar de " + monthLabelNow()
        + " pero no lo pude hacer desde la web. Te confirmo por acá.";
      var contenedor = document.getElementById("error");
      contenedor.innerHTML = "No se pudo enviar la confirmación. Revisá tu conexión y probá de nuevo, "
        + "o confirmale directo al profe por WhatsApp."
        + (TELEFONO_PROFE && TELEFONO_PROFE !== "5491100000000"
          ? ' <a href="https://wa.me/' + TELEFONO_PROFE + '?text=' + encodeURIComponent(msgWa) + '" target="_blank" style="color: inherit; text-decoration: underline;">Abrir WhatsApp</a>'
          : "");
      contenedor.className = "error show";
    }

    document.getElementById("confirmar").onclick = function () {
      limpiarError();
      var boton = document.getElementById("confirmar");
      boton.disabled = true;
      boton.textContent = "Confirmando…";

      fetch(SUPA_URL + "/rest/v1/confirmaciones", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPA_KEY,
          "Authorization": "Bearer " + SUPA_KEY,
          "Prefer": "return=minimal",
        },
        body: JSON.stringify({
          student_id: studentId,
          student_name: studentName,
          mes: monthKeyToUse(),
        }),
      }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status + " al registrar la confirmación");
        mostrarListo();
      }).catch(function () {
        mostrarErrorEnvio();
      }).finally(function () {
        boton.disabled = false;
        boton.textContent = "Confirmar mi lugar";
      });
    };
  </script>
</body>
</html>
